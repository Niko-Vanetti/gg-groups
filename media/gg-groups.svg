<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="GG Groups">
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="0.55" stop-color="#2E8FE6"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="ggSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8AD8FF"/>
      <stop offset="1" stop-color="#3E9BEA"/>
    </linearGradient>
  </defs>

  <!-- Carpeta de fondo: lo que la extension organiza -->
  <path fill="url(#gg)" opacity="0.16"
        d="M14 34a8 8 0 0 1 8-8h26l9 10h43a8 8 0 0 1 8 8v56a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8z"/>
  <path fill="none" stroke="url(#gg)" stroke-width="4" stroke-linejoin="round" opacity="0.55"
        d="M14 34a8 8 0 0 1 8-8h26l9 10h43a8 8 0 0 1 8 8v56a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8z"/>

  <!-- Dos G entrelazadas: los grupos que se unen -->
  <g fill="none" stroke-linecap="round" stroke-width="11">
    <path stroke="url(#ggSoft)"
          d="M62 50a20 20 0 1 0 0 30h2V66h-9"/>
    <path stroke="url(#gg)"
          d="M92 50a20 20 0 1 0 0 30h2V66h-9"/>
  </g>

  <!-- Tres puntos: los iconos ya ordenados -->
  <g fill="url(#gg)">
    <circle cx="30" cy="58" r="4.5"/>
    <circle cx="30" cy="72" r="4.5"/>
    <circle cx="30" cy="86" r="4.5"/>
